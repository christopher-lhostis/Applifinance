[package]
name = "mon-budget"
version = "0.1.0"
edition = "2021"
description = "Application de gestion de finances personnelles, simple et locale"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
lto = true
strip = true
