[package]
name = "mon-budget"
version = "0.3.0"
edition = "2021"
description = "Application de gestion de finances personnelles, simple et locale (web, graphique et console)"
default-run = "mon-budget"

[lib]
name = "mon_budget"
path = "src/lib.rs"

[[bin]]
name = "mon-budget"
path = "src/main.rs"

[[bin]]
name = "mon-budget-egui"
path = "src/bin/egui.rs"

[[bin]]
name = "mon-budget-cli"
path = "src/bin/cli.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
eframe = { version = "=0.31.1", default-features = false, features = ["glow", "default_fonts", "x11"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1.0.154"
tiny_http = "0.12.0"

[profile.release]
lto = true
strip = true
